
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For My Bacchu ❤️</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            font-family: Georgia, serif;

            background:
                radial-gradient(
                    circle at center,
                    #480027 0%,
                    #210014 35%,
                    #090008 72%,
                    #020003 100%
                );

            color: white;
        }


        /* =========================
           MAIN SCENE
        ========================= */

        .scene {
            position: relative;

            width: 100%;
            height: 100dvh;

            min-height: 500px;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        .moon {
            position: absolute;

            width: min(75vw, 400px);
            height: min(75vw, 400px);

            border-radius: 50%;

            background:
                rgba(255, 50, 130, .09);

            filter: blur(70px);

            animation:
                moonPulse 5s ease-in-out infinite;
        }

        @keyframes moonPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: .5;
            }

            50% {
                transform: scale(1.25);
                opacity: .9;
            }
        }


        /* =========================
           STARS
        ========================= */

        .star {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 6px white,
                0 0 15px #ff8db8;

            animation:
                twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .1;
                transform: scale(.5);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }


        /* =========================
           HEART AREA
        ========================= */

        .heart-area {

            position: absolute;

            left: 50%;
            top: 43%;

            transform:
                translate(-50%, -50%);

            width: clamp(
                180px,
                45vw,
                280px
            );

            aspect-ratio: 1.12 / 1;

            z-index: 5;

            animation:
                heartbeat 2.1s ease-in-out infinite 6s;
        }

        svg {
            width: 100%;
            height: 100%;

            overflow: visible;
        }

        .heart {

            fill: transparent;

            stroke: #ff4d91;

            stroke-width: 4;

            stroke-linecap: round;
            stroke-linejoin: round;

            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;

            filter:
                drop-shadow(0 0 5px #ff4d91)
                drop-shadow(0 0 15px #ff3b81)
                drop-shadow(0 0 30px #ff0066)
                drop-shadow(0 0 50px #ff0066);

            animation:
                drawHeart 5s ease forwards,
                fillHeart 2s ease 4.8s forwards;
        }

        @keyframes drawHeart {

            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fillHeart {

            from {
                fill: transparent;
            }

            to {
                fill: rgba(255, 20, 100, .85);
            }
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            40% {
                transform:
                    translate(-50%, -50%)
                    scale(1.08);
            }

            55% {
                transform:
                    translate(-50%, -50%)
                    scale(1.02);
            }

            70% {
                transform:
                    translate(-50%, -50%)
                    scale(1.06);
            }
        }


        /* =========================
           HEART GLOW
        ========================= */

        .heart-glow {

            position: absolute;

            width: 65%;
            aspect-ratio: 1;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background: #ff0066;

            filter: blur(60px);

            opacity: 0;

            z-index: -1;

            animation:
                glowAppear 2s ease 4.5s forwards,
                glowPulse 2s ease-in-out infinite 7s;
        }

        @keyframes glowAppear {

            to {
                opacity: .4;
            }
        }

        @keyframes glowPulse {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.3);
            }
        }


        /* =========================
           TEXT
        ========================= */

        .content {

            position: absolute;

            top: calc(43% + clamp(105px, 20vw, 145px));

            left: 0;

            width: 100%;

            padding: 0 20px;

            text-align: center;

            z-index: 10;

            pointer-events: none;
        }

        .title {

            opacity: 0;

            color: #ffd8e7;

            font-size:
                clamp(21px, 4vw, 31px);

            line-height: 1.3;

            text-shadow:
                0 0 8px white,
                0 0 18px #ff70a5,
                0 0 35px #ff0066;

            animation:
                appear 2s ease 6s forwards;
        }

        .subtitle {

            margin-top: 8px;

            opacity: 0;

            color: #ff9fc2;

            font-size:
                clamp(9px, 1.8vw, 15px);

            letter-spacing:
                clamp(2px, .7vw, 4px);

            line-height: 1.5;

            animation:
                appear 2s ease 6.7s forwards;
        }

        @keyframes appear {

            from {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(.8);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            position: absolute;

            bottom:
                max(25px, env(safe-area-inset-bottom));

            left: 50%;

            transform:
                translateX(-50%);

            width: 100%;

            padding: 0 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            z-index: 30;

            opacity: 0;

            animation:
                buttonsAppear
                1.5s
                ease
                7.5s
                forwards;
        }

        @keyframes buttonsAppear {

            from {
                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(25px);
            }

            to {
                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }

        button {

            min-width: 135px;

            padding:
                11px 18px;

            border:
                1px solid
                rgba(255, 140, 180, .7);

            border-radius: 999px;

            background:
                rgba(255, 30, 110, .15);

            color: #ffd8e7;

            font-family: Georgia, serif;

            font-size: 14px;

            cursor: pointer;

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 0 12px
                rgba(255, 50, 120, .3);

            transition:
                transform .25s ease,
                background .25s ease,
                box-shadow .25s ease;
        }

        button:hover {

            transform:
                translateY(-4px)
                scale(1.04);

            background:
                rgba(255, 40, 120, .35);

            box-shadow:
                0 0 15px #ff4d91,
                0 0 30px
                rgba(255, 0, 100, .5);
        }

        button:active {

            transform:
                scale(.95);
        }


        /* =========================
           POPUP
        ========================= */

        .surprise {

            position: fixed;

            inset: 0;

            padding:
                20px;

            display: flex;

            justify-content: center;
            align-items: center;

            background:
                rgba(5, 0, 8, .78);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            z-index: 100;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .4s ease;
        }

        .surprise.active {

            opacity: 1;

            visibility: visible;
        }

        .card {

            width: min(
                100%,
                420px
            );

            max-height: 85vh;

            overflow-y: auto;

            padding:
                clamp(25px, 7vw, 40px)
                clamp(20px, 6vw, 30px);

            text-align: center;

            border-radius: 25px;

            border:
                1px solid
                rgba(255, 120, 170, .5);

            background:
                linear-gradient(
                    145deg,
                    rgba(100, 0, 50, .94),
                    rgba(25, 0, 20, .97)
                );

            box-shadow:
                0 0 35px
                rgba(255, 0, 100, .35);

            transform:
                scale(.7);

            transition:
                transform .6s
                cubic-bezier(.2, 1.4, .4, 1);
        }

        .surprise.active .card {

            transform:
                scale(1);
        }

        .card-heart {

            font-size:
                clamp(42px, 12vw, 60px);

            animation:
                cardBeat
                1.2s
                ease-in-out
                infinite;
        }

        @keyframes cardBeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        .card h2 {

            margin:
                12px 0;

            color: #ffb7d0;

            font-size:
                clamp(22px, 6vw, 28px);

            text-shadow:
                0 0 15px #ff3b81;
        }

        .card p {

            color: #ffdce9;

            font-size:
                clamp(14px, 4vw, 17px);

            line-height: 1.7;
        }

        .close {

            margin-top: 20px;
        }


        /* =========================
           FLOATING HEARTS
        ========================= */

        .floating-heart {

            position: absolute;

            bottom: -45px;

            color: #ff78a9;

            pointer-events: none;

            z-index: 4;

            text-shadow:
                0 0 5px #ff8db8,
                0 0 15px #ff3b81,
                0 0 30px #ff0066;

            animation:
                floatUp
                linear
                forwards;
        }

        @keyframes floatUp {

            0% {

                opacity: 0;

                transform:
                    translateY(0)
                    translateX(0)
                    scale(.3)
                    rotate(0);
            }

            15% {
                opacity: .9;
            }

            50% {

                transform:
                    translateY(-50vh)
                    translateX(50px)
                    scale(1)
                    rotate(15deg);
            }

            100% {

                opacity: 0;

                transform:
                    translateY(-115vh)
                    translateX(-40px)
                    scale(.5)
                    rotate(-20deg);
            }
        }


        /* =========================
           SEND LOVE EXPLOSION
        ========================= */

        .explosion-heart {

            position: fixed;

            left: 50%;
            top: 50%;

            z-index: 200;

            pointer-events: none;

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(.2);

            animation:
                explodeHeart
                1.8s
                cubic-bezier(.2, .8, .3, 1)
                forwards;
        }

        @keyframes explodeHeart {

            0% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(.2);
            }

            10% {

                opacity: 1;
            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(1.1)
                    rotate(var(--rotate));
            }
        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 480px) {

            .scene {
                min-height: 480px;
            }

            .heart-area {
                top: 40%;
            }

            .content {
                top: calc(40% + 105px);
            }

            .title {
                font-size: 20px;
            }

            .subtitle {
                margin-top: 6px;
                font-size: 9px;
            }

            .buttons {

                flex-direction: column;

                gap: 8px;

                bottom:
                    max(18px, env(safe-area-inset-bottom));
            }

            button {

                width: min(
                    220px,
                    80vw
                );

                min-width: 0;

                padding: 10px 15px;
            }
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-height: 650px) {

            .heart-area {
                top: 37%;
            }

            .content {
                top: calc(37% + 95px);
            }

            .buttons {
                bottom: 12px;
            }

            button {
                padding: 8px 14px;
            }
        }


        /* =========================
           TABLETS
        ========================= */

        @media (min-width: 601px)
        and (max-width: 1024px) {

            .heart-area {
                top: 42%;
            }

            .content {
                top: calc(42% + 130px);
            }

            .buttons {
                bottom: 40px;
            }
        }


        /* =========================
           LANDSCAPE MOBILE
        ========================= */

        @media
        (max-height: 500px)
        and (orientation: landscape) {

            .heart-area {

                width: 150px;

                top: 38%;
            }

            .content {

                top: calc(38% + 75px);
            }

            .title {
                font-size: 18px;
            }

            .subtitle {
                display: none;
            }

            .buttons {

                bottom: 10px;

                flex-direction: row;
            }

            button {

                padding: 7px 14px;

                font-size: 12px;
            }
        }

    </style>
</head>


<body>

<div class="scene">

    <!-- Background -->
    <div class="moon"></div>


    <!-- Main Heart -->
    <div class="heart-area">

        <div class="heart-glow"></div>

        <svg viewBox="0 0 200 180">

            <path
                class="heart"
                d="
                M100 165
                C90 155 20 115 20 60
                C20 20 70 5 100 45
                C130 5 180 20 180 60
                C180 115 110 155 100 165
                Z
                "
            />

        </svg>

    </div>


    <!-- Message -->
    <div class="content">

        <div class="title">
            I love u so much bacchu ❤️
        </div>

        <div class="subtitle">
            YOU MAKE MY WORLD BEAUTIFUL ✨
        </div>

    </div>


    <!-- Buttons -->
    <div class="buttons">

        <button onclick="showSurprise()">
            💌 A Surprise
        </button>

        <button onclick="sendLove()">
            💕 Send Love
        </button>

    </div>

</div>


<!-- Popup -->

<div
    class="surprise"
    id="surprise">

    <div class="card">

        <div class="card-heart">
            💗
        </div>

        <h2>
            A Little Message
        </h2>

        <p>
            You are truly special. ❤️
            <br><br>

            Some people make ordinary moments
            feel a little more beautiful. ✨
        </p>

        <button
            class="close"
            onclick="closeSurprise()">

            Close ❤️

        </button>

    </div>

</div>


<script>


/* =========================
   STARS
========================= */

for (let i = 0; i < 70; i++) {

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    document
        .querySelector(".scene")
        .appendChild(star);
}


/* =========================
   FLOATING HEARTS
========================= */

function createFloatingHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    const symbols = [
        "♥",
        "♡",
        "❤",
        "💕",
        "💗",
        "💖"
    ];

    heart.innerHTML =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.fontSize =
        (12 + Math.random() * 22) + "px";

    const duration =
        5 + Math.random() * 5;

    heart.style.animationDuration =
        duration + "s";

    document
        .querySelector(".scene")
        .appendChild(heart);

    setTimeout(() => {

        heart.remove();

    }, (duration + 1) * 1000);
}


setInterval(
    createFloatingHeart,
    500
);


/* =========================
   SURPRISE
========================= */

function showSurprise() {

    document
        .getElementById("surprise")
        .classList.add("active");

    sendLove();
}


/* =========================
   CLOSE
========================= */

function closeSurprise() {

    document
        .getElementById("surprise")
        .classList.remove("active");
}


/* =========================
   SEND LOVE ❤️
========================= */

function sendLove() {

    const hearts = [
        "❤️",
        "💗",
        "💕",
        "💖",
        "💓",
        "💞",
        "♥"
    ];

    for (let i = 0; i < 45; i++) {

        const heart =
            document.createElement("div");

        heart.className =
            "explosion-heart";

        heart.innerHTML =
            hearts[
                Math.floor(
                    Math.random() *
                    hearts.length
                )
            ];


        /* Random direction */

        const angle =
            Math.random() *
            Math.PI * 2;

        const distance =
            80 +
            Math.random() * 280;

        const x =
            Math.cos(angle) *
            distance;

        const y =
            Math.sin(angle) *
            distance;


        heart.style.setProperty(
            "--x",
            x + "px"
        );

        heart.style.setProperty(
            "--y",
            y + "px"
        );

        heart.style.setProperty(
            "--rotate",
            (-180 +
            Math.random() * 360) +
            "deg"
        );


        /* Responsive heart size */

        const size =
            Math.max(
                14,
                Math.min(
                    32,
                    window.innerWidth * .055
                )
            );

        heart.style.fontSize =
            size + "px";


        /* Random speed */

        heart.style.animationDuration =
            (1.2 +
            Math.random() * .8) +
            "s";


        document.body.appendChild(
            heart
        );


        setTimeout(() => {

            heart.remove();

        }, 2200);
    }
}


/* =========================
   ESC TO CLOSE
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeSurprise();
        }
    }
);

</script>

</body>

</html>
